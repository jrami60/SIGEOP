<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema de Gestión Operativa</title>
    <base href="/" />

    <!-- Favicon corporativo de SIGEO -->
    <link rel="icon" type="image/png" href="images/logo.png" />

    <!-- Iconos de Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Hoja de Estilos Global -->
    <link href="css/app.css" rel="stylesheet" />

    <!-- CSS Aislado de Blazor (.razor.css) -->
    <link href="SistemaGestionWeb.styles.css" rel="stylesheet" /> 
</head>
<body>
    <div id="app">Cargando sistema...</div>
    <script src="_framework/blazor.webassembly.js"></script>

    <!-- ==========================================
         SCRIPT: GESTIÓN DE TEMAS
         ========================================== -->
    <script>
        window.setTheme = function (themeName) {
            document.body.setAttribute('data-theme', themeName);
            localStorage.setItem('user_theme', themeName);
        };

        window.getTheme = function () {
            return localStorage.getItem('user_theme') || 'claro';
        };

        // Aplica el tema inmediatamente al cargar la página para evitar parpadeos
        (function () {
            const savedTheme = localStorage.getItem('user_theme') || 'claro';
            document.body.setAttribute('data-theme', savedTheme);
        })();
    </script>

    <!-- ==========================================
         SCRIPT: GESTIÓN DE WEBCAM (UNIFICADO)
         ========================================== -->
    <script>
        let streamWebcam = null;

        window.iniciarWebcam = async function (videoId) {
            try {
                let videoElement = document.getElementById(videoId);
                let intentos = 0;
                while (!videoElement && intentos < 10) {
                    await new Promise(r => setTimeout(r, 100));
                    videoElement = document.getElementById(videoId);
                    intentos++;
                }

                if (!videoElement) {
                    console.error("El elemento video no se encontró en el DOM.");
                    return;
                }

                try {
                    streamWebcam = await navigator.mediaDevices.getUserMedia({ 
                        video: { facingMode: { ideal: "environment" } }, 
                        audio: false 
                    });
                } catch (e) {
                    streamWebcam = await navigator.mediaDevices.getUserMedia({ 
                        video: true, 
                        audio: false 
                    });
                }

                videoElement.srcObject = streamWebcam;
                await videoElement.play();

            } catch (err) {
                alert("No se pudo iniciar la cámara. Verifica los permisos del navegador.");
                console.error(err);
            }
        };

        window.capturarFotoWebcam = function (videoId) {
            const videoElement = document.getElementById(videoId);
            if (!videoElement) return "";

            const canvas = document.createElement("canvas");
            canvas.width = videoElement.videoWidth || 640;
            canvas.height = videoElement.videoHeight || 480;
            
            const context = canvas.getContext("2d");
            context.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
            
            return canvas.toDataURL("image/jpeg", 0.85);
        };

        window.detenerWebcam = function () {
            if (streamWebcam) {
                streamWebcam.getTracks().forEach(track => track.stop());
                streamWebcam = null;
            }
        };

        // Alias para compatibilidad con llamadas antiguas
        window.startWebcam = window.iniciarWebcam;
        window.captureWebcam = window.capturarFotoWebcam;
        window.stopWebcam = window.detenerWebcam;
    </script>
    <!-- ==========================================
         SCRIPT: DESCARGA DE ARCHIVOS
         ========================================== -->
    <script>
        window.downloadFileFromStream = async (fileName, base64Content) => {
            const link = document.createElement('a');
            link.download = fileName;
            link.href = "data:text/csv;charset=utf-8;base64," + base64Content;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };
    </script>

    <script>
        window.animarElemento = function (elementId) {
            const el = document.getElementById(elementId);
            if (el) {
                el.style.transition = "all 0.3s ease";
                el.style.border = "2px solid #0284c7";
                el.style.boxShadow = "0 0 15px rgba(2, 132, 199, 0.5)";
                
                setTimeout(() => {
                    el.style.border = "";
                    el.style.boxShadow = "";
                }, 800); 
            }
        };
    </script>

    <script>
        window.animarPestaña = function (elementId) {
            const el = document.getElementById(elementId);
            if (el) {
                el.style.transition = "all 0.4s ease";
                el.style.boxShadow = "0 0 20px rgba(2, 132, 199, 0.35)";
                el.style.boxShadow = "0 0 20px #0284c7";

                setTimeout(() => {
                    el.style.boxShadow = "";
                    el.style.borderColor = "";
                }, 600);
            }
        };
    </script>

    </body>
</html>
